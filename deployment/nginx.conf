server {
  listen 443 ssl;
  server_name pms.example.com;
  ssl_certificate /etc/letsencrypt/live/pms.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/pms.example.com/privkey.pem;
  root /srv/pms/client/dist;
  index index.html;
  client_max_body_size 64k;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
  location /api/ {
    proxy_pass http://127.0.0.1:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
  }
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }
  location = /index.html { expires -1; }
  location / { try_files $uri $uri/ /index.html; }
}

server {
  listen 80;
  server_name pms.example.com;
  return 301 https://pms.example.com$request_uri;
}
