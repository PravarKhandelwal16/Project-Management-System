name: pms
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-project_management}
      MYSQL_USER: ${DB_USER:-pms_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--host=localhost", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  server:
    build: {context: .., dockerfile: deployment/server.Dockerfile}
    env_file: [deployment.env]
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 3306
      PORT: 5000
    depends_on:
      db: {condition: service_healthy}
    expose: ["5000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    init: true
  migrate:
    build: {context: .., dockerfile: deployment/server.Dockerfile}
    env_file: [deployment.env]
    environment: {NODE_ENV: production, DB_HOST: db, DB_PORT: 3306}
    depends_on:
      db: {condition: service_healthy}
    command: ["npm","run","db:migrate"]
    profiles: [tools]
  client:
    build: {context: .., dockerfile: deployment/client.Dockerfile}
    ports: ["127.0.0.1:8080:80"]
    environment:
      TRUSTED_EDGE_PROXY: ${TRUSTED_EDGE_PROXY:-172.29.0.1}
      NGINX_ENVSUBST_FILTER: TRUSTED_EDGE_PROXY
    networks:
      default:
        ipv4_address: ${PMS_CLIENT_IP:-172.29.0.10}
    depends_on:
      server: {condition: service_healthy}
    restart: unless-stopped
volumes:
  mysql_data:
networks:
  default:
    ipam:
      config:
        - subnet: ${PMS_SUBNET:-172.29.0.0/24}
