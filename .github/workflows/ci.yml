name: Quality checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: pms_test
      DB_PASSWORD: ci-isolated-only
      DB_NAME: project_management_unused
      DB_NAME_TEST: project_management_test
      EXPO_PUBLIC_API_URL: https://example.invalid/api
      JWT_SECRET: ci-tests-only-not-a-production-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: 'server/package-lock.json'}
      - name: Start native MySQL and create isolated test account
        env:
          MYSQL_PWD: root
        run: |
          sudo systemctl start mysql.service
          mysql --host=127.0.0.1 --user=root <<'SQL'
          CREATE USER 'pms_test'@'localhost' IDENTIFIED BY 'ci-isolated-only';
          GRANT ALL PRIVILEGES ON `project_management_test%`.* TO 'pms_test'@'localhost';
          SQL
      - run: npm ci
      - run: npm ci --prefix server
      - run: npm ci --prefix client
      - run: npm ci --prefix mobile
      - run: npm --prefix mobile run typecheck
      - run: npm --prefix mobile run test:coverage
      - run: npm --prefix mobile run bundle:android
      - run: npm --prefix server run test:coverage
      - run: npm --prefix client run lint
      - run: npm --prefix client run build
      - run: npx --prefix client playwright install --with-deps chromium
      - run: npm --prefix client test
      - run: npm audit --omit=dev --audit-level=high --prefix server
      - run: npm audit --audit-level=high --prefix client
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-reports
          path: |
            server/coverage
            mobile/coverage
            client/playwright-report
            client/test-results
